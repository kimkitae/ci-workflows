name: AI Code Review (Reusable, with auto-fix)

# Reusable AI code review workflow with automatic fix loop.
#
# Usage from a caller repo:
#
#   jobs:
#     review:
#       uses: kimkitae/ci-workflows/.github/workflows/ai-review.yml@main
#       with:
#         max_iterations: "3"
#         model: "claude-sonnet-4-5"
#       secrets:
#         ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
#
# On every PR open/synchronize:
#   1. Claude reviews the diff and outputs a Korean verdict.
#   2. If "평가: 수정 필요" — Claude generates corrected file contents,
#      the workflow commits + pushes them back to the PR branch.
#   3. The loop repeats up to max_iterations times.
#   4. A final comment is posted on the PR.
#
# Forks are skipped automatically (no push permission).

on:
  workflow_call:
    inputs:
      language:
        description: 'Review comment language (ko or en)'
        type: string
        default: 'ko'
      model:
        description: 'Claude model to use'
        type: string
        default: 'claude-sonnet-4-5'
      max_diff_size:
        description: 'Max diff size in chars sent to Claude'
        type: number
        default: 80000
      max_iterations:
        description: 'Max auto-fix iterations before giving up'
        type: number
        default: 3
    secrets:
      ANTHROPIC_API_KEY:
        required: true

permissions:
  pull-requests: write
  contents: write
  issues: write

jobs:
  review:
    # Fork PRs cannot be auto-fixed (no push permission to the fork)
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout caller PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout ci-workflows for auto-fix script
        uses: actions/checkout@v4
        with:
          repository: kimkitae/ci-workflows
          ref: main
          path: .ci-workflows

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run AI review with auto-fix loop
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          MAX_FIX_ITERATIONS: ${{ inputs.max_iterations }}
          MAX_DIFF_SIZE: ${{ inputs.max_diff_size }}
          CLAUDE_MODEL: ${{ inputs.model }}
          REVIEW_LANGUAGE: ${{ inputs.language }}
        run: node .ci-workflows/scripts/ai-review-autofix.mjs
