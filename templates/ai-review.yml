name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize]
    branches: [develop, main]

permissions:
  pull-requests: write
  contents: read

jobs:
  review:
    uses: kimkitae/ci-workflows/.github/workflows/ai-review.yml@main
    with:
      language: ko
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
